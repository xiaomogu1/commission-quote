# prd: deployed to AWS, talking to the real vendor. Same rules as stg: no defaults, secrets injected
# by the platform from AWS Secrets Manager.
app:
  security:
    enabled: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # The Keycloak realm that signs staff tokens, e.g. https://sso.example.com/realms/lending
          issuer-uri: ${OIDC_ISSUER_URI:}

# vendor.base-url and vendor.api-key come from VENDOR_BASE_URL / VENDOR_API_KEY (see application.yml).
# There is deliberately no default: if either is missing, the app refuses to start.

logging:
  level:
    root: WARN
    com.bendigo: INFO

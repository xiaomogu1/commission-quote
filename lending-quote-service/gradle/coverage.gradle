// Coverage: one report across all three test levels; the build fails if any counter is below its minimum.
// Generated code is excluded: Lombok methods (marked @Generated via lombok.config), MapStruct mapper
// implementations, and the one-line main class.
// Report: build/reports/jacoco/test/html/index.html
apply plugin: 'jacoco'

tasks.withType(JacocoReportBase).configureEach {
    dependsOn 'unitTest', 'componentTest', 'blackBoxTest'
    executionData fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec')
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude '**/*MapperImpl.class', '**/LendingQuoteServiceApplication.class'
    })
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // 95% everywhere, deliberately not 100%: a hard 100% gate pushes people to write tests that only
            // chase numbers, or to delete sensible defensive checks.
            [
                INSTRUCTION: 0.95,
                LINE       : 0.95,
                METHOD     : 0.95,
                CLASS      : 0.95,
                BRANCH     : 0.95,
                COMPLEXITY : 0.95,
            ].each { counterName, threshold ->
                limit {
                    counter = counterName
                    minimum = threshold
                }
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

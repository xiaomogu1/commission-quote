# Runs this service on its own, with a WireMock stub standing in for the vendor. From lending-quote-service/:
#   docker compose -f docker/docker-compose.yml up --build
#
# The stub (src/test/blackbox/resources/wiremock/mappings) needs nothing outside this service:
#   - api-key must be "local-dev-only-key", otherwise 401
#   - any valid request              -> 200, commissionRate 0.006
#   - loanAmount 4040.40             -> vendor returns 500   (try the UI error state)
#   - loanAmount 5040.40             -> vendor takes 5s      (slower than our 3s timeout -> 504)
#
# To run against the real mock vendor or the whole system, use the docker-compose.yml at the repo root.
# Real keys are never committed: in stg/prd the platform injects VENDOR_API_KEY from AWS Secrets Manager.
services:
  vendor-stub:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating"]
    ports:
      - "8081:8080"   # exposed only so you can curl it directly; the browser never talks to it
    volumes:
      - ../src/test/blackbox/resources/wiremock:/home/wiremock

  lending-quote-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      VENDOR_BASE_URL: http://vendor-stub:8080
      VENDOR_API_KEY: local-dev-only-key
      VENDOR_READ_TIMEOUT: ${VENDOR_READ_TIMEOUT:-3s}
    depends_on:
      - vendor-stub

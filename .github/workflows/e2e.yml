name: e2e

# The whole system end to end: any change to an application, the compose file or the tests themselves.
on:
  push:
    branches: [main]
    paths:
      - "lending-quote-service/**"
      - "mock-vendor/**"
      - "quote-ui/**"
      - "e2e-tests/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "lending-quote-service/**"
      - "mock-vendor/**"
      - "quote-ui/**"
      - "e2e-tests/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: End-to-end tests (builds and starts docker-compose.yml)
        run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-e2e
          path: e2e-tests/build/reports/tests

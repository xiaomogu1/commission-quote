name: mock-vendor

on:
  push:
    branches: [main]
    paths: ["mock-vendor/**", ".github/workflows/mock-vendor.yml"]
  pull_request:
    paths: ["mock-vendor/**", ".github/workflows/mock-vendor.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: ./gradlew build
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t mock-vendor:${{ github.sha }} .
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-mock-vendor
          path: mock-vendor/build/reports/tests

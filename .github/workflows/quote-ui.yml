name: quote-ui

on:
  push:
    branches: [main]
    paths: ["quote-ui/**", ".github/workflows/quote-ui.yml"]
  pull_request:
    paths: ["quote-ui/**", ".github/workflows/quote-ui.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quote-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quote-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve the service name per request through Docker's DNS, so nginx starts even if the
    # service isn't resolvable yet (a hostname written directly in proxy_pass must resolve at startup).
    resolver 127.0.0.11 valid=10s;
    set $quote_service http://lending-quote-service:8080;

    # The browser only talks to this origin; API calls are forwarded to the service inside the docker network.
    location /api/ {
        proxy_pass $quote_service;
    }

    location / {
        try_files $uri /index.html;
    }
}
